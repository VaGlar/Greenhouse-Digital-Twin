# Example greenhouse configuration — illustrative placeholder values.
# Replace with the real parameters of the 5-stremma tomato greenhouse once
# they are finalized; nothing else in the codebase needs to change.

name: "Παράδειγμα θερμοκηπίου τομάτας 5 στρεμμάτων"

geometry:
  area_m2: 5000                  # site-specific design figure ("5 στρέμματα") — kept at 5000 by user decision,
                                  # distinct from the real quote's own conflicting 5280/6393 m2 figures (see below)
  height_m: 5.67                 # SOURCED: derived average height for a Gothic-arch bay, real quote geometry
                                  # (Geothermiki S192G, 5-bay x 9.6m, side 4.0m, ridge 6.5m) — avg = side + rise*(2/3)
                                  # for a circular-arc roof; see papers/geothermiki-s192g-quote.md
  cover_u_value_w_m2k: 4.4       # SOURCED: real cover material is double-inflated PE (not single glass) — U-value
                                  # for double-layer inflated PE with air gap; papers/tunnelvisionhoops-double-layer.md
                                  # (caveat: that source's PE is 1mm thick vs. our film's 180 micron — best figure found)
  cover_transmissivity: 0.90     # SOURCED: 180-micron thermal/anti-drip greenhouse film, 88-92% PAR transmission
                                  # (matches the real quote's cover spec); papers/greenhouse-film-180micron-transmission.md
  cover_area_factor: 1.45        # SOURCED: computed from real arch geometry (5 bays x 9.6m chord, 2.5m rise, 100m
                                  # length, 4.0m side walls) — see docs/assumptions/geometry-and-chp.md for the derivation

chp:
  electric_power_kw: 1000        # FIXED electrical output (grid-driven, not greenhouse-driven) — site-specific 1MW spec
  heat_to_power_ratio: 1.15      # PLACEHOLDER, plausible but unverified: general CHP lit. quotes ~0.8-1.0,
                                  # some engine units to ~1.1-1.2 with full heat recovery — replace with OEM datasheet
  co2_kg_per_kwh_elec: 0.18      # PLACEHOLDER, derived not sourced — see docs/assumptions/geometry-and-chp.md

climate_control:
  heating_setpoint_day_c: 20.0    # SOURCED: within cited optimal daytime range 21-27C, conservative end
                                   # (review of optimum temp/VPD for greenhouse tomato, researchgate 323225604)
  heating_setpoint_night_c: 17.0  # SOURCED: matches cited optimal nighttime range 17-18C, same source
  day_start_hour: 6                # PLACEHOLDER: flat clock-time window, not derived from real sunrise/sunset
  day_end_hour: 20                 # PLACEHOLDER: see docs/assumptions/climate-control.md
  vent_temp_margin_c: 2.0          # PLACEHOLDER: control-engineering choice, not tomato-specific source
  vent_max_ach: 15.0               # PLACEHOLDER: plausible order of magnitude, not benchmarked to real vent design
  vent_min_ach: 0.5                # PLACEHOLDER: generic baseline leakage assumption
  co2_setpoint_day_ppm: 700.0       # SOURCED: corrected from 900 -- specific study testing 500/700/850/1000ppm
                                     # found 700ppm optimal, no yield benefit above it (papers/tomato-co2-optimum-700ppm.md)
  co2_ambient_ppm: 420.0           # SOURCED, factual: current global atmospheric CO2 (~420-425ppm, NOAA/Mauna Loa)
  effective_heat_capacity_j_m2k: 40000.0  # PLACEHOLDER: lumped single-zone thermal mass estimate, not measured
  screen_energy_saving_fraction: 0.55  # SOURCED: real thermal screen spec (type PH55), deployed at night
                                         # (papers/geothermiki-s192g-quote.md — 55% shading / 55% energy saving)
  dehumidification_setpoint_pct: 70.0   # SOURCED: pollination optimum for greenhouse tomato RH
                                         # (papers/greenhouse-tomato-optimal-rh.md); active dehum. modeled as unconstrained

crop:
  variety: "Beefsteak tomato"      # site-specific placeholder
  planting_date: 2026-09-15        # site-specific placeholder
  density_plants_per_m2: 2.5       # SOURCED: standard commercial single-stem high-wire density 2.3-2.5 plants/m2
                                    # (VT Extension SPES-474; Peet & Welles, "Greenhouse Tomato Production")
  lai_max: 3.5                     # PLACEHOLDER: plausible order of magnitude (typically cited 3-4), not individually sourced
  lai_ramp_days: 60                # PLACEHOLDER: engineering guess, not sourced
  fruiting_start_days: 35          # PLACEHOLDER: plausible order of magnitude, not individually sourced
  fruiting_ramp_days: 20           # PLACEHOLDER: not sourced
  fruit_partition_fraction_max: 0.85  # SOURCED: raised from 0.6 to match TOMGRO lit. (Bertin & Gary 1993),
                                    # which reports 80-90% of dry-matter gain to fruit at peak fruiting
  dry_matter_content_fruit: 0.055  # SOURCED: ripe tomato fruit dry matter ~5.5% (USDA composition data, 94.5% water)

hydroponic:
  system_type: "NFT"   # flag only in v1 — not modeled in depth yet

weather:
  source: "synthetic"  # PLACEHOLDER by design — switch to "csv" + csv_path once real local weather data is available;
                        # see docs/assumptions/weather.md — this is the highest-value real-data upgrade available
  latitude_deg: 37.9           # site-specific (Athens) — NOTE: currently unused by the synthetic generator's math
  mean_annual_temp_c: 18.0     # SITE-SPECIFIC, plausible: roughly matches Athens/Attica annual mean (~17-19C)
  seasonal_amplitude_c: 9.0    # PLACEHOLDER: plausible Mediterranean order of magnitude, not verified vs. real station data
  diurnal_amplitude_c: 6.0     # PLACEHOLDER: same, not verified
  peak_solar_w_m2: 850.0       # PLACEHOLDER, plausible: Mediterranean summer noon peak commonly cited 800-1000 W/m2

simulation:
  start_date: 2026-09-15
  duration_days: 150
  timestep_hours: 1.0
