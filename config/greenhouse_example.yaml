# Example greenhouse configuration — illustrative placeholder values.
# Replace with the real parameters of the 5-stremma tomato greenhouse once
# they are finalized; nothing else in the codebase needs to change.

name: "Παράδειγμα θερμοκηπίου τομάτας 5 στρεμμάτων"

geometry:
  area_m2: 5000                  # site-specific design figure ("5 στρέμματα") — kept at 5000 by user decision,
                                  # distinct from the real quote's own conflicting 5280/6393 m2 figures (see below)
  height_m: 5.67                 # SOURCED: derived average height for a Gothic-arch bay, real quote geometry
                                  # (Geothermiki S192G, 5-bay x 9.6m, side 4.0m, ridge 6.5m) — avg = side + rise*(2/3)
                                  # for a circular-arc roof; see docs/papers/geothermiki-s192g-quote.md
  cover_u_value_w_m2k: 4.4       # SOURCED: real cover material is double-inflated PE (not single glass) — U-value
                                  # for double-layer inflated PE with air gap; docs/papers/tunnelvisionhoops-double-layer.md
                                  # (caveat: that source's PE is 1mm thick vs. our film's 180 micron — best figure found)
  cover_transmissivity: 0.90     # SOURCED: 180-micron thermal/anti-drip greenhouse film, 88-92% PAR transmission
                                  # (matches the real quote's cover spec); docs/papers/greenhouse-film-180micron-transmission.md
  cover_area_factor: 1.45        # SOURCED: computed from real arch geometry (5 bays x 9.6m chord, 2.5m rise, 100m
                                  # length, 4.0m side walls) — see docs/assumptions/geometry-and-chp.md for the derivation

chp:
  electric_power_kw: 1000        # FIXED electrical output (grid-driven, not greenhouse-driven) — site-specific 1MW spec
  heat_to_power_ratio: 1.15      # PLACEHOLDER, plausible but unverified: general CHP lit. quotes ~0.8-1.0,
                                  # some engine units to ~1.1-1.2 with full heat recovery — replace with OEM datasheet
  co2_kg_per_kwh_elec: 0.18      # PLACEHOLDER, derived not sourced — see docs/assumptions/geometry-and-chp.md

climate_control:
  heating_setpoint_day_c: 20.0    # SOURCED: within cited optimal daytime range 21-27C, conservative end
                                   # (review of optimum temp/VPD for greenhouse tomato, researchgate 323225604)
  heating_setpoint_night_c: 17.0  # SOURCED: matches cited optimal nighttime range 17-18C, same source
  day_start_hour: 6                # PLACEHOLDER: flat clock-time window, not derived from real sunrise/sunset
  day_end_hour: 20                 # PLACEHOLDER: see docs/assumptions/climate-control.md
  vent_temp_margin_c: 2.0          # PLACEHOLDER: control-engineering choice, not tomato-specific source
  vent_max_ach: 15.0               # PLACEHOLDER: plausible order of magnitude, not benchmarked to real vent design
  vent_min_ach: 0.5                # PLACEHOLDER: generic baseline leakage assumption
  co2_setpoint_day_ppm: 700.0       # SOURCED: corrected from 900 -- specific study testing 500/700/850/1000ppm
                                     # found 700ppm optimal, no yield benefit above it (docs/papers/tomato-co2-optimum-700ppm.md)
  co2_ambient_ppm: 420.0           # SOURCED, factual: current global atmospheric CO2 (~420-425ppm, NOAA/Mauna Loa)
  effective_heat_capacity_j_m2k: 40000.0  # PLACEHOLDER: lumped single-zone thermal mass estimate, not measured
  screen_energy_saving_fraction: 0.55  # SOURCED: real thermal screen spec (type PH55) — 55% shading AND
                                         # ~55% energy saving, same fabric (docs/papers/geothermiki-s192g-quote.md)
  chp_heat_margin_fraction: 0.9    # PLACEHOLDER: safety margin for the screen's cold-trigger — see
                                     # docs/assumptions/climate-control.md. Deployment is fully automatic
                                     # (night / too-hot / cold-with-net-benefit), not user-configurable.
  dehumidification_setpoint_pct: 70.0   # SOURCED: pollination optimum for greenhouse tomato RH
                                         # (docs/papers/greenhouse-tomato-optimal-rh.md)
  dehumidification_capacity_kg_water_per_hour: 771.0  # PLACEHOLDER: no capacity spec in the real
                                         # quote -- rescaled from a full semi-closed climate
                                         # system's cooling capacity, see
                                         # docs/papers/greenhouse-dehumidification-capacity.md
  fan_pad_cooling_enabled: true    # Initial config choice: does this greenhouse have fan-and-pad
                                     # evaporative cooling? Enabled for this greenhouse -- see docs/assumptions/climate-control.md
  fan_pad_efficiency: 0.80         # SOURCED: UF/IFAS Extension CIR1135/AE069, up to 85% for a well-maintained
                                     # system; only used when fan_pad_cooling_enabled is true
  dehumidification_specific_power_kwh_per_kg: 0.22  # SOURCED: DryGair DG-12 published spec
                                     # (9.55 kW / ~45 kg/hour), see docs/assumptions/economics.md
  ventilation_specific_fan_power_w_per_m3h: 0.03    # SOURCED: mid-range of real greenhouse
                                     # ventilation fans (0.025-0.045 W per m3/h), see
                                     # docs/assumptions/economics.md
  recirculation_fan_power_kw: 4.7  # PLACEHOLDER: 35 ACF21 recirculation fans (estimated from
                                     # the quote's own geometry + real HAF spacing guidance,
                                     # not a real fan count) x specific fan power, see
                                     # docs/assumptions/economics.md

  # Phase-aware climate control, temperature only (2026-08-31, first pass). heating_setpoint_
  # day_c/night_c above are now explicitly the VEGETATIVE-phase target; each later phase's real
  # target = that baseline + its delta here. SOURCED: general greenhouse-tomato grower guidance
  # repeatedly cites the flowering/fruit-set/full-fruiting period as running ~2C warmer (both
  # day and night) than the vegetative stage. ramp_up (the fruit-set ramp itself) gets the same
  # delta as full_fruiting, since the cited guidance doesn't distinguish a separate intermediate
  # target for that window. See docs/assumptions/climate-control.md,
  # docs/plans/2026-08-31-phase-aware-climate-design.md.
  ramp_up_heating_setpoint_day_delta_c: 2.0
  ramp_up_heating_setpoint_night_delta_c: 2.0
  full_fruiting_heating_setpoint_day_delta_c: 2.0
  full_fruiting_heating_setpoint_night_delta_c: 2.0

crop:
  variety: "Beef tomato (EYRE RZ F1-class, ~230-280g)"  # PLACEHOLDER: chosen after checking
                                    # regional fit, market demand, and a real Northern Greece
                                    # CHP+hydroponic precedent -- not a confirmed real seed
                                    # order. See docs/assumptions/crop-model.md and
                                    # docs/papers/tomato-variety-selection-northern-greece.md.
  planting_date: 2026-09-15        # site-specific placeholder
  density_plants_per_m2: 2.5       # SOURCED: standard commercial single-stem high-wire density 2.3-2.5 plants/m2
                                    # (VT Extension SPES-474; Peet & Welles, "Greenhouse Tomato Production")
  lai_max: 3.5                     # PLACEHOLDER: plausible order of magnitude (typically cited 3-4), not individually sourced
  lai_ramp_days: 60                # PLACEHOLDER: engineering guess, not sourced
  fruiting_start_days: 35          # PLACEHOLDER: plausible order of magnitude, not individually sourced
  fruiting_ramp_days: 20           # PLACEHOLDER: not sourced
  fruit_partition_fraction_max: 0.85  # SOURCED: raised from 0.6 to match TOMGRO lit. (Bertin & Gary 1993),
                                    # which reports 80-90% of dry-matter gain to fruit at peak fruiting
  dry_matter_content_fruit: 0.055  # SOURCED: ripe tomato fruit dry matter ~5.5% (USDA composition data, 94.5% water)
  target_fruit_weight_g: 255.0     # SOURCED: EYRE RZ F1 spec, 230-280g range, midpoint used --
                                    # see docs/papers/tomato-variety-selection-northern-greece.md
  fruits_per_truss: 5.0            # SOURCED: generic beef/TOV class benchmark (4-6/truss),
                                    # not an EYRE RZ F1 datasheet figure -- see same doc
  stems_per_plant: 1                # SITE-SPECIFIC: 1 for EYRE RZ F1-class (single-stem);
                                    # set to 2 if a two-stem variety (e.g. Belladona F1) is chosen
  photosynthesis_t_min_c: 10.0      # SOURCED: moved from twin/crop_model.py constants, same
  photosynthesis_t_opt_c: 27.0      # values as before -- now per-variety config, not code.
  photosynthesis_t_max_c: 35.0      # See docs/assumptions/crop-model.md
  fruit_set_t_min_c: 12.0           # SOURCED: same, for the much narrower fruit-set response --
  fruit_set_t_opt_c: 18.0           # the trait that actually differs meaningfully between real
  fruit_set_t_max_c: 24.0           # varieties (e.g. Merlice F1's heat-tolerant fruit set)
  canopy_light_extinction_coeff: 0.75  # SOURCED: Beer-Lambert k, moved from crop_model.py
  maintenance_respiration_fraction_per_day: 0.015  # PLACEHOLDER, moved from crop_model.py

hydroponic:
  system_type: "drip_substrate"   # SOURCED (corrected 2026-08-26, was "NFT"): real commercial
                                   # greenhouse tomato uses drip-irrigated substrate, not NFT.
                                   # See docs/assumptions/hydroponics.md.
  substrate_type: "rockwool"      # descriptive only, doesn't yet feed the physics
  ec_target_ms_cm: 3.0            # SOURCED: 2.0-3.5 mS/cm commonly cited range for greenhouse tomato
  ph_target: 6.0                  # SOURCED: 5.5-6.5 optimal nutrient-availability range
  drainage_target_fraction: 0.25  # SOURCED: 20-30% standard leaching fraction for substrate culture
  irrigation_pump_specific_power_kwh_per_m3: 0.28  # SOURCED: general drip-irrigation average
                                                    # (not this specific pump's spec)
  fertilizer_g_per_l_per_ec_unit: 0.64  # PLACEHOLDER: generic EC-to-TDS conversion factor

  # Level B: EC -> fruit dry-matter (B1) and EC -> BER risk / nutrient deficiency (B2). SOURCED
  # peak, PLACEHOLDER curvature (judgment call). B2 is a continuous bell peaked at
  # ec_optimal_ms_cm -- not a flat range with sharp thresholds -- see docs/assumptions/hydroponics.md.
  ec_dry_matter_reference_ms_cm: 2.3
  ec_dry_matter_slope_per_ms_cm: 0.0028
  ec_optimal_ms_cm: 3.0
  ec_high_side_curvature_per_ms_cm2: 0.0444
  ec_low_side_curvature_per_ms_cm2: 0.0375
  ber_yield_loss_fraction_max: 0.35
  ec_deficiency_yield_loss_fraction_max: 0.50

  # pH -> nutrient availability -> yield loss, continuous bell peaked at ph_optimal (same reason
  # as EC's continuous redesign above -- see docs/assumptions/hydroponics.md). SOURCED peak;
  # PLACEHOLDER curvature/cap, higher cap than any single damped-tier nutrient since pH gates
  # availability of all of them at once.
  ph_optimal: 5.5
  ph_curvature_per_ph_unit2: 0.0667
  ph_availability_penalty_cap_fraction: 0.15

  # Recipe "damped" tier: N/K/Mg/B -- real mechanism, deliberately capped magnitude. Ranges
  # SOURCED (CEAC Arizona / Florida IFAS tomato formulas); penalty cap PLACEHOLDER.
  n_ppm: 105.0
  n_min_optimal_ppm: 60.0
  n_max_optimal_ppm: 150.0
  k_ppm: 300.0
  k_min_optimal_ppm: 199.0
  k_max_optimal_ppm: 400.0
  mg_ppm: 65.0             # SOURCED: CEAC Arizona formula (constant across its 3 recipe variants)
  mg_min_optimal_ppm: 45.0
  mg_max_optimal_ppm: 70.0
  b_ppm: 0.40               # SOURCED: CEAC Arizona micronutrient formula
  b_min_optimal_ppm: 0.30
  b_max_optimal_ppm: 0.50
  damped_nutrient_penalty_cap_fraction: 0.02  # PLACEHOLDER
  recipe_adequacy_multiplier_min: 0.85        # PLACEHOLDER

  # Recipe "informational" tier: P/S/Fe/Mn/Zn/Cu/Mo -- displayed only, no model effect. SOURCED
  # (CEAC Arizona formula; Mn/Zn have a notable disagreement with Florida IFAS, see hydroponics.md).
  p_ppm: 62.0
  s_ppm: 110.0
  fe_ppm: 2.5
  mn_ppm: 0.55
  zn_ppm: 0.33
  cu_ppm: 0.05
  mo_ppm: 0.05

weather:
  source: "csv_typical_year"   # SOURCED: real 10-year (2015-2024) hourly average for Αλεξάνδρεια Ημαθίας, via the
                                # Open-Meteo Historical Weather API — see docs/assumptions/weather.md,
                                # docs/papers/open-meteo-historical-weather-api.md. Replaces the synthetic sine-wave
                                # generator below, which is kept only as source: "synthetic" fallback values.
  csv_path: config/weather/alexandreia-imathias-typical-year.csv
  latitude_deg: 40.63          # SITE-SPECIFIC: Αλεξάνδρεια Ημαθίας — still unused by the model's math (see weather.md)
  mean_annual_temp_c: 18.0     # unused while source is csv_typical_year — only feeds the "synthetic" generator
  seasonal_amplitude_c: 9.0    # unused while source is csv_typical_year — only feeds the "synthetic" generator
  diurnal_amplitude_c: 6.0     # unused while source is csv_typical_year — only feeds the "synthetic" generator
  peak_solar_w_m2: 850.0       # unused while source is csv_typical_year — only feeds the "synthetic" generator

simulation:
  start_date: 2026-09-15
  duration_days: 330   # SOURCED: real commercial indeterminate greenhouse tomato cropping cycles
                        # run ~10-11 months before replanting -- the plant itself has no natural
                        # end-of-life (indeterminate growth). See docs/assumptions/crop-model.md.
  timestep_hours: 1.0
